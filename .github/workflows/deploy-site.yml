name: Deploy vaib Marketing Page

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'template.html'
      - 'README.md'
      - 'build_page.py'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Compilers & Parsers
        run: pip install markdown beautifulsoup4

      - name: Pre-compile README into Premium Theme Shell
        run: python3 build_page.py

      - name: Inject Jekyll Bypass Flag
        run: |
          touch .nojekyll
          echo "Cache Seed: $(date +%s)" > cache_bust.txt

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Package Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
