<!DOCTYPE html>
<html lang="en" class="bg-[#030303] text-zinc-50 antialiased selection:bg-cyan-500 selection:text-zinc-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — The Shorthand Protocol for Agentic Coding</title>
    
    <!-- Stable Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden bg-[#030303] relative font-['Plus_Jakarta_Sans',sans-serif]">

    <!-- Ambient Grid & Radial Neon Highlights (t3.codes inspired) -->
    <div class="absolute inset-0 pointer-events-none z-0 min-h-[1200px]" 
         style="background-size: 40px 40px; background-image: linear-gradient(to right, rgba(39, 39, 42, 0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(39, 39, 42, 0.1) 1px, transparent 1px); mask-image: radial-gradient(ellipse at top, black 60%, transparent 95%); -webkit-mask-image: radial-gradient(ellipse at top, black 60%, transparent 95%);">
    </div>
    <div class="absolute top-[-5%] left-[20%] w-[600px] h-[400px] rounded-full bg-cyan-500/10 blur-[130px] pointer-events-none z-0"></div>
    <div class="absolute top-[40%] right-[-10%] w-[450px] h-[450px] rounded-full bg-blue-500/5 blur-[120px] pointer-events-none z-0"></div>

    <!-- Navigation Header Bar -->
    <header class="border-b border-zinc-900 bg-[#030303]/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-extrabold tracking-tight text-white select-none">🌊 vaib</span>
                <span class="px-2 py-0.5 text-[10px] font-bold bg-zinc-900 text-zinc-400 rounded-full border border-zinc-800 tracking-wider uppercase">V1.0 Live</span>
            </div>
            <a href="https://github.com" target="_blank" class="text-sm font-semibold text-zinc-400 hover:text-zinc-100 transition-colors flex items-center space-x-1.5">
                <span>View Source GitHub</span>
                <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>
        </div>
    </header>

    <!-- Main Component Document Render Box -->
    <main class="max-w-5xl mx-auto px-6 py-16 w-full flex-grow relative z-10">
        <div id="vaib-compiled-root" class="space-y-24">
            <!-- {{VAIB_DYNAMIC_MARKDOWN_BODY}} -->
        </div>
    </main>

    <!-- Footer Block -->
    <footer class="border-t border-zinc-900 py-10 bg-[#030303] relative z-10">
        <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-zinc-500 gap-4">
            <div>&copy; 2026 vaib Architecture Ecosystem. Distributed under MIT bounds.</div>
            <div class="tracking-wide uppercase font-semibold text-zinc-700 font-mono text-[10px]">Pre-Compiled Production Build</div>
        </div>
    </footer>

</body>
</html>
