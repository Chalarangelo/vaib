<!DOCTYPE html>
<html lang="en" style="background-color: #030303; color: #f4f4f5;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — Vibe-Accelerated Intent Blocks for Agentic Engineering</title>
    
    <!-- Hardened Pre-Compiled Tailwind CSS Framework (Zero Script Runtime Dependencies) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Premium Geist + JetBrains Mono Typography Sync from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Geist', sans-serif; background-color: #030303; color: #8e8e93; margin: 0; padding: 0; overflow-x: hidden; }
        code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* t3-Inspired Subdued Dot Grid Canvas Backdrop Overlay */
        .grid-bg {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at top, black 50%, transparent 95%);
            -webkit-mask-image: radial-gradient(ellipse at top, black 50%, transparent 95%);
        }
        
        /* Deep Structural Markdown Document Restyling Enforcements */
        .markdown-body h1 { font-size: 2rem; font-weight: 800; color: #ffffff; margin-top: 4rem; margin-bottom: 1.5rem; letter-spacing: -0.04em; border-bottom: 1px solid #1c1c1e; padding-bottom: 0.75rem; font-family: 'Geist', sans-serif; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 800; color: #ffffff; margin-top: 4rem; margin-bottom: 1rem; letter-spacing: -0.03em; border-bottom: 1px solid #1c1c1e; padding-bottom: 0.5rem; font-family: 'Geist', sans-serif; }
        .markdown-body h3 { font-size: 1.1rem; font-weight: 700; color: #22d3ee; margin-top: 2.5rem; margin-bottom: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
        .markdown-body p { color: #8e8e93; font-size: 1rem; line-height: 1.7; margin-bottom: 1.5rem; font-family: 'Geist', sans-serif; }
        .markdown-body ul { list-style-type: none; padding-left: 0; margin-bottom: 1.75rem; }
        .markdown-body li { position: relative; padding-left: 1.75rem; margin-bottom: 0.75rem; color: #ededed; font-size: 0.95rem; line-height: 1.6; }
        .markdown-body li::before { content: "✓"; position: absolute; left: 0; color: #30d158; font-weight: bold; }
        .markdown-body blockquote { border-left: 3px solid #27272a; background-color: rgba(28, 28, 30, 0.4); padding: 1.25rem 1.5rem; border-top-right-radius: 0.75rem; border-bottom-right-radius: 0.75rem; font-style: italic; color: #ededed; margin: 2.5rem 0; line-height: 1.65; }
        
        /* High-Density Semantic Rules Tables Layout mapping your custom grammar tokens */
        .markdown-body table { width: 100%; text-align: left; border-collapse: collapse; margin: 2.5rem 0; font-size: 0.875rem; border: 1px solid #1c1c1e; border-radius: 0.75rem; overflow: hidden; background-color: rgba(28, 28, 30, 0.2); }
        .markdown-body th { background-color: #1c1c1e; padding: 1rem; color: #ffffff; font-weight: 600; border-bottom: 1px solid #1c1c1e; font-family: 'Geist', sans-serif; }
        .markdown-body td { padding: 1rem; color: #8e8e93; border-bottom: 1px solid rgba(28, 28, 30, 0.6); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
        .markdown-body tr:last-child td { border-bottom: 0; }
        
        /* Inline inline token text highlights */
        .markdown-body code { padding: 0.15rem 0.4rem; background-color: #1c1c1e; border: 1px solid #2c2c2e; color: #5af2ff; border-radius: 0.375rem; font-weight: 500; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; }
        
        /* Safe Color Tokens for Clean, High-Contrast Monospaced Snippets */
        .token-keyword { color: #ff453a; font-weight: 600; }
        .token-symbol { color: #5af2ff; }
        .token-string { color: #30d158; }
        .token-comment { color: #636366; font-style: italic; }
        .token-macro { color: #ff9f0a; font-weight: 500; }
    </style>
</head>

        <div class="max-w-3xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">

</body>
