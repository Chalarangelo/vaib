<!DOCTYPE html>
<html lang="en" class="bg-[#030303] text-zinc-400 antialiased selection:bg-zinc-800 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — The Open Source Control Plane for Coding Agents</title>
    
    <!-- Hardened Tailwind v3 Play Engine -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Premium Geist + JetBrains Mono Typography Sync -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Geist', sans-serif; background-color: #030303; color: #8e8e93; }
        code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Premium t3 Grid Backdrops Pattern Matrix */
        .grid-bg {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at top, black 60%, transparent 95%);
            -webkit-mask-image: radial-gradient(ellipse at top, black 60%, transparent 95%);
        }
        
        /* Deep Markdown Node Structural Enforcements */
        .markdown-body h1 { @apply text-3xl font-black text-white mt-16 mb-6 tracking-tight border-b border-zinc-900 pb-3; }
        .markdown-body h2 { @apply text-2xl font-black text-white mt-16 mb-4 tracking-tight border-b border-zinc-900 pb-2; }
        .markdown-body h3 { @apply text-lg font-bold text-zinc-200 mt-10 mb-3 tracking-tight; }
        .markdown-body p { @apply text-zinc-400 text-[15px] leading-relaxed mb-4; }
        .markdown-body ul { @apply space-y-2 mb-6 list-none pl-0; }
        .markdown-body li { @apply text-zinc-300 text-[14px] leading-relaxed relative pl-6; }
        .markdown-body li::before { content: "✓"; @apply absolute left-0 text-emerald-500 font-bold; }
        .markdown-body blockquote { @apply border-l-2 border-zinc-700 bg-zinc-900/30 px-4 py-3 rounded-r-xl italic text-zinc-300 my-6 text-[14px] leading-relaxed; }
        .markdown-body table { @apply w-full text-left border-collapse my-6 text-xs bg-zinc-950/40 border border-zinc-900 rounded-xl overflow-hidden; }
        .markdown-body th { @apply bg-zinc-900/80 px-4 py-3 text-zinc-200 font-bold border-b border-zinc-900 tracking-wider; }
        .markdown-body td { @apply px-4 py-3 text-zinc-400 border-b border-zinc-900/50 font-mono leading-normal; }
        .markdown-body tr:last-child td { @apply border-b-0; }
        .markdown-body code { @apply px-1.5 py-0.5 bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-md font-mono text-[12px] mx-0.5; }
    </style>
</head>
<body class="min-h-screen bg-[#030303] text-zinc-400 flex flex-col justify-between overflow-x-hidden relative">

    <!-- Ambient Grid Backdrop -->
    <div class="absolute inset-0 pointer-events-none z-0 grid-bg min-h-[1400px]"></div>

    <!-- Sticky Navigation Top Bar -->
    <header class="border-b border-zinc-900 bg-[#030303]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-black text-white tracking-widest uppercase select-none">vaib</span>
                <span class="px-2 py-0.5 text-[9px] font-bold bg-zinc-900 text-zinc-500 rounded-full border border-zinc-800 tracking-wider uppercase">V1.0</span>
            </div>
            
            <!-- Sleek Off-White Gray Nav Links -->
            <div class="flex items-center space-x-4">
                <a href="https://github.com" target="_blank" class="text-xs font-medium text-zinc-400 hover:text-white transition-colors">Download</a>
                <a href="https://github.com" target="_blank" class="px-3 py-1.5 text-xs font-semibold bg-zinc-900 text-zinc-300 rounded-full border border-zinc-800 hover:text-white hover:border-zinc-700 transition-all flex items-center space-x-1.5">
                    <span>⭐️</span>
                    <span>GitHub stars</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Center Column Main Content Area -->
    <main class="max-w-3xl mx-auto px-6 py-12 w-full flex-grow relative z-10">
        <div id="vaib-compiled-root" class="w-full">
            <!-- {{VAIB_DYNAMIC_MARKDOWN_BODY}} -->
        </div>
    </main>

    <!-- Clean Pre-Compiled t3 Style Footer -->
    <footer class="border-t border-zinc-900 py-10 bg-[#030303] relative z-10 text-[11px] text-zinc-600 font-sans">
        <div class="max-w-3xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-zinc-400 uppercase tracking-wider text-[10px]">vaib</span>
                <span>&copy; 2026. MIT licensed.</span>
            </div>
            <div class="flex items-center space-x-5 text-zinc-500 font-medium">
                <a href="https://github.com" target="_blank" class="hover:text-white transition-colors">GitHub</a>
                <a href="#" class="hover:text-white transition-colors">Discord</a>
                <a href="https://github.com/main/install.sh" class="hover:text-white transition-colors">Download</a>
                <a href="#" class="hover:text-white transition-colors">Privacy</a>
            </div>
        </div>
    </footer>

</body>
</html>
