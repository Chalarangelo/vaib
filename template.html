<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — Semantic constraints for agentic engineering</title>
    <!-- Wave Emoji Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Token Highlighting Syntax Rules */
        .token-key { color: #c084fc; font-weight: 600; }
        .token-string { color: #34d399; }
        .token-fn-prefix { color: #f43f5e; font-weight: bold; }
        .token-fn-name { color: #38bdf8; font-weight: bold; }
        .token-section { color: #a78bfa; font-weight: bold; }
        .token-type { color: #fbbf24; }
        .token-keyword { color: #f472b6; font-weight: 600; }
        .token-operator { color: #38bdf8; font-weight: bold; }
        .token-command { color: #a78bfa; font-weight: bold; background: rgba(167, 139, 250, 0.1); padding: 1px 4px; rounded: 4px; }
        .token-comment { color: #6b7280; font-style: italic; }

        .markdown-body code:not(pre code) {
            background-color: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            padding: 0.2em 0.4em;
            border-radius: 0.375rem;
            font-size: 0.85em;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .markdown-body li {
            margin-top: 0.375rem;
            margin-bottom: 0.375rem;
            color: #d1d5db;
            font-size: 0.9375rem;
            line-height: 1.6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-purple-500/30 selection:text-purple-200">

    <div class="max-w-2xl mx-auto px-4 sm:px-6 w-full">
        <!-- Minimal Top Nav -->
        <header class="py-6 border-b border-zinc-800/60 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌊</span>
                <span class="font-extrabold text-xl tracking-wider text-white font-mono">vaib</span>
            </div>
            <a href="https://github.com/Chalarangelo/vaib" target="_blank" class="text-xs font-semibold text-zinc-300 hover:text-white bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-md transition-colors flex items-center space-x-1.5 shadow-sm">
                <span>Star on GitHub</span>
                <span class="text-amber-400">★</span>
            </a>
        </header>

        <!-- Main Body Injection -->
        <main class="py-6">
            __VAIB_CONTENT__
        </main>
    </div>

    <!-- Footer -->
    <footer class="border-t border-zinc-800/60 py-8 text-center text-xs text-zinc-500 font-mono">
        <p>vaib — Open Source Cognitive Steering Protocol</p>
    </footer>

    <!-- Copy to Clipboard Logic -->
    <script>
        function copyCodeBlock(button) {
            const container = button.closest('.group');
            const codeEl = container.querySelector('code');
            if (codeEl) {
                navigator.clipboard.writeText(codeEl.innerText).then(() => {
                    button.textContent = "Copied!";
                    button.classList.add('text-emerald-400', 'border-emerald-500/50');
                    setTimeout(() => {
                        button.textContent = "Copy";
                        button.classList.remove('text-emerald-400', 'border-emerald-500/50');
                    }, 2000);
                });
            }
        }

        function copyHeroCmd(button) {
            const input = document.getElementById('hero-cmd');
            if (input) {
                navigator.clipboard.writeText(input.value).then(() => {
                    button.textContent = "Copied!";
                    button.classList.add('text-emerald-400', 'border-emerald-500/50');
                    setTimeout(() => {
                        button.textContent = "Copy";
                        button.classList.remove('text-emerald-400', 'border-emerald-500/50');
                    }, 2000);
                });
            }
        }
    </script>
</body>
</html>
