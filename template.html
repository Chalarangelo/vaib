<!DOCTYPE html>
<html lang="en" style="background-color: #030303; color: #f4f4f5;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — Vibe-Accelerated Intent Blocks for Agentic Engineering</title>
    
    <!-- Hardened Pre-Compiled Tailwind CSS Framework (Zero Script Runtime Dependencies) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Premium Geist + JetBrains Mono Typography Sync from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* T3-inspired Design System Tokens */
        :root {
        --bg-main: #090d16;
        --bg-card: #111827;
        --bg-code: #030712;
        --border-color: #1f2937;
        --border-hover: #374151;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --accent-purple: #a855f7;
        --accent-blue: #3b82f6;
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --max-width: 960px;
        }

        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: var(--font-sans);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        padding: 2rem 1rem;
        }

        /* Page Layout Container */
        .container {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        }

        /* Header & Typography */
        header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 1.5rem;
        }

        h1 {
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(to right, #ffffff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        }

        .subtitle {
        color: var(--text-muted);
        font-size: 1.125rem;
        margin-top: 0.5rem;
        }

        /* Code Blocks & Alignment */
        .code-wrapper {
        background-color: var(--bg-code);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        background-color: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid var(--border-color);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--text-muted);
        }

        pre {
        padding: 1.25rem;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        line-height: 1.7;
        color: #e2e8f0;
        }

        code {
        font-family: var(--font-mono);
        }

        /* Syntax Highlighting Colors */
        .token-keyword { color: #c678dd; font-weight: 600; }
        .token-string { color: #98c379; }
        .token-function { color: #61afef; }
        .token-comment { color: #5c6370; font-style: italic; }
        .token-type { color: #e5c07b; }

        /* Grid / Content Cards */
        .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.25rem;
        }

        .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        padding: 1.5rem;
        transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .card:hover {
        border-color: var(--border-hover);
        }

        .card h3 {
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
        font-family: var(--font-mono);
        color: var(--accent-purple);
        }
    </style>
</head>
<body class="min-h-screen bg-[#030303] text-[#8e8e93] antialiased flex flex-col justify-between relative">

    <!-- Subtle Matrix Background Elements -->
    <div class="absolute inset-0 pointer-events-none z-0 grid-bg min-h-[1400px]"></div>
    <div class="absolute top-[-10%] left-[20%] w-[600px] h-[400px] rounded-full bg-gradient-to-r from-cyan-500/5 to-blue-500/5 blur-[120px] pointer-events-none z-0"></div>

    <!-- Navigation Header Panel Component -->
    <header class="border-b border-[#1c1c1e] bg-[#030303] bg-opacity-75 backdrop-filter backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-black text-white tracking-widest uppercase select-none font-sans">vaib</span>
                <span class="px-2 py-0.5 text-[9px] font-bold bg-[#1c1c1e] text-zinc-500 rounded-full border border-[#2c2c2e] tracking-wider uppercase font-sans">V1.0 LIVE</span>
            </div>
            
            <div class="flex items-center space-x-5 font-sans">
                <a href="https://github.com" target="_blank" class="text-xs font-medium text-zinc-400 hover:text-white transition-colors">Download</a>
                <a href="https://github.com" target="_blank" class="px-3 py-1.5 text-xs font-semibold bg-[#1c1c1e] text-zinc-300 rounded-full border border-[#2c2c2e] hover:text-white hover:border-[#3a3a3c] transition-all flex items-center space-x-1.5">
                    <span>⭐️</span>
                    <span>GitHub stars</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Content Target Canvas Container -->
    <main class="max-w-3xl mx-auto px-6 py-12 w-full flex-grow relative z-10">
        <div id="vaib-compiled-root" class="w-full">
            <!-- {{VAIB_DYNAMIC_MARKDOWN_BODY}} -->
        </div>
    </main>

    <!-- Clean Pre-Compiled Static Footer Base -->
    <footer class="border-t border-[#1c1c1e] py-10 bg-[#030303] relative z-10 text-[11px] text-[#636366] font-sans">
        <div class="max-w-3xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-zinc-400 uppercase tracking-wider text-[10px]">vaib</span>
                <span>&copy; 2026. MIT licensed.</span>
            </div>
            <div class="flex items-center space-x-5 text-zinc-500 font-medium">
                <a href="https://github.com" target="_blank" class="hover:text-white transition-colors">GitHub</a>
                <a href="#" class="hover:text-white transition-colors">Discord</a>
                <a href="https://github.com/main/install.sh" class="hover:text-white transition-colors">Download</a>
                <a href="#" class="hover:text-white transition-colors">Privacy</a>
            </div>
        </div>
    </footer>

</body>
</html>
