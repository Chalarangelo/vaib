<!DOCTYPE html>
<html lang="en" style="background-color: #030303; color: #f4f4f5;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — The Shorthand Protocol for Agentic Coding</title>
    
    <!-- Hardened Pre-Compiled Production CSS Engine (Zero-Runtime Dependency) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Premium Google Font Architecture -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030303; color: #a1a1aa; }
        code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Strict Pre-Baked Dark Theme Style Directives for pre-rendered markdown nodes */
        .markdown-body h1 { font-size: 2.25rem; font-weight: 800; color: #ffffff; margin-bottom: 1.5rem; border-bottom: 1px solid #27272a; padding-bottom: 0.75rem; margin-top: 3.5rem; letter-spacing: -0.025em; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 700; color: #ffffff; margin-bottom: 1rem; border-bottom: 1px solid #27272a; padding-bottom: 0.5rem; margin-top: 3.5rem; letter-spacing: -0.025em; }
        .markdown-body h3 { font-size: 1.125rem; font-weight: 700; color: #22d3ee; margin-bottom: 0.75rem; margin-top: 2rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .markdown-body p { color: #a1a1aa; font-size: 1rem; line-height: 1.75; margin-bottom: 1.25rem; }
        .markdown-body ul { list-style-type: disc; list-style-position: inside; color: #a1a1aa; padding-left: 1rem; margin-bottom: 1.25rem; }
        .markdown-body li { margin-bottom: 0.5rem; line-height: 1.625; }
        .markdown-body blockquote { border-left: 4px solid #06b6d4; background-color: rgba(39, 39, 42, 0.3); padding: 1rem 1.25rem; border-top-right-radius: 0.75rem; border-bottom-right-radius: 0.75rem; font-style: italic; color: #e4e4e7; margin: 2rem 0; line-height: 1.625; }
        
        /* High-density grid data tables formatting mapping your rules tools */
        .markdown-body table { width: 100%; text-align: left; border-collapse: collapse; margin: 2rem 0; font-size: 0.875rem; background-color: rgba(24, 24, 27, 0.2); border: 1px solid #27272a; border-radius: 0.75rem; overflow: hidden; }
        .markdown-body th { background-color: rgba(39, 39, 42, 0.6); padding: 0.875rem 1rem; color: #e4e4e7; font-weight: 700; border-b: 1px solid #27272a; border-bottom: 1px solid #27272a; }
        .markdown-body td { padding: 0.875rem 1rem; color: #a1a1aa; border-bottom: 1px solid rgba(39, 39, 42, 0.4); }
        .markdown-body tr:last-child td { border-bottom: 0; }
        
        /* Code block structures and token aesthetics */
        .markdown-body pre { background-color: rgba(24, 24, 27, 0.9); padding: 1.25rem; border-radius: 1rem; border: 1px solid #27272a; overflow-x: auto; margin: 2rem 0; color: #e4e4e7; font-size: 0.875rem; line-height: 1.625; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .markdown-body code { padding: 0.125rem 0.375rem; background-color: #18181b; border: 1px solid #27272a; color: #22d3ee; border-radius: 0.375rem; font-weight: 500; font-size: 0.875rem; }
        .markdown-body pre code { padding: 0; background-color: transparent; border: 0; color: #e4e4e7; border-radius: 0; font-size: 0.875rem; margin: 0; }
    </style>
</head>
<body class="min-h-screen bg-[#030303] text-zinc-400 font-sans flex flex-col justify-between overflow-x-hidden relative" style="margin: 0; padding: 0;">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>

    <main class="max-w-4xl mx-auto px-6 py-16 w-full flex-grow relative z-10">

    <!-- Footer Block -->
    <footer class="border-t border-zinc-900 py-10 bg-[#030303] relative z-10">
        <div class="max-w-4xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-zinc-600 gap-4">
            <div>&copy; 2026 vaib Architecture framework. Open-source under MIT bounds.</div>

        </div>

</body>
