<!DOCTYPE html>
<html lang="en" style="background-color: #030303; color: #f4f4f5;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vaib — The Shorthand Protocol for Agentic Coding</title>
    
    <!-- Pre-Compiled Production CSS Engine -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Premium Google Font Architecture -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030303; color: #a1a1aa; overflow-x: hidden; }
        code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* t3.codes Style Grid Overlay Backdrop Pattern */
        .grid-bg {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(63, 63, 70, 0.08) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(63, 63, 70, 0.08) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at top, black 50%, transparent 90%);
            -webkit-mask-image: radial-gradient(ellipse at top, black 50%, transparent 90%);
        }

        /* Smooth Interactive Entrance Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes glowMovement {
            0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
            50% { transform: translate(30px, -20px) scale(1.1); opacity: 0.5; }
        }
        
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-glow { animation: glowMovement 12s infinite ease-in-out; }
        
        /* Clean Markdown Styling Boundaries */
        .markdown-body h2 { font-size: 1.75rem; font-weight: 800; color: #ffffff; margin-top: 4rem; margin-bottom: 1.5rem; letter-spacing: -0.025em; border-bottom: 1px solid #1f1f23; padding-bottom: 0.5rem; }
        .markdown-body h3 { font-size: 1.125rem; font-weight: 700; color: #22d3ee; margin-top: 2.5rem; margin-bottom: 0.75rem; font-mono: tracking-wider; text-transform: uppercase; }
        .markdown-body p { color: #a1a1aa; font-size: 1rem; line-height: 1.75; margin-bottom: 1.25rem; }
        .markdown-body ul { list-style-type: disc; list-style-position: inside; color: #a1a1aa; padding-left: 0.5rem; margin-bottom: 1.5rem; }
        .markdown-body li { margin-bottom: 0.5rem; color: #a1a1aa; }
        .markdown-body blockquote { border-left: 3px solid #06b6d4; background-color: rgba(24, 24, 27, 0.4); padding: 1rem 1.25rem; border-radius: 0 0.75rem 0.75rem 0; font-style: italic; color: #e4e4e7; margin: 2rem 0; }
        
        /* Structural Data Tables matching the specification constraints */
        .markdown-body table { width: 100%; text-align: left; border-collapse: collapse; margin: 2rem 0; font-size: 0.875rem; background-color: rgba(24, 24, 27, 0.2); border: 1px solid #1f1f23; border-radius: 0.75rem; overflow: hidden; }
        .markdown-body th { background-color: rgba(27, 27, 30, 0.8); padding: 0.875rem 1rem; color: #e4e4e7; font-weight: 700; border-bottom: 1px solid #1f1f23; }
        .markdown-body td { padding: 0.875rem 1rem; color: #a1a1aa; border-bottom: 1px solid rgba(27, 27, 30, 0.5); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
        .markdown-body tr:last-child td { border-bottom: 0; }
        
        /* Shorthand codeblocks framework styles */
        .markdown-body pre { background-color: #09090b; padding: 1.25rem; border-radius: 0.75rem; border: 1px solid #1f1f23; overflow-x: auto; margin: 1.5rem 0; color: #e4e4e7; font-size: 0.85rem; line-height: 1.6; }
        .markdown-body code { padding: 0.125rem 0.375rem; background-color: #18181b; border: 1px solid #27272a; color: #22d3ee; border-radius: 0.375rem; font-weight: 500; font-size: 0.85rem; }
        .markdown-body pre code { padding: 0; background-color: transparent; border: 0; color: #e4e4e7; border-radius: 0; font-size: 0.85rem; margin: 0; }
    </style>
</head>
<body class="min-h-screen bg-[#030303] text-zinc-400 font-sans flex flex-col justify-between relative" style="margin: 0; padding: 0;">

    <!-- Background Grid Canvas & Glowing Ambient Orbs -->
    <div class="absolute inset-0 pointer-events-none z-0 grid-bg"></div>
    <div class="absolute top-[-10%] left-[25%] w-[600px] h-[400px] rounded-full bg-cyan-500/10 blur-[120px] pointer-events-none z-0 animate-glow"></div>
    <div class="absolute top-[45%] right-[-5%] w-[400px] h-[400px] rounded-full bg-blue-500/5 blur-[100px] pointer-events-none z-0"></div>

    <!-- Navigation Bar -->
    <header class="border-b border-zinc-900 bg-[#030303] bg-opacity-75 backdrop-filter backdrop-blur-md sticky top-0 z-50 animate-fade-in">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-extrabold tracking-tight text-white select-none">🌊 vaib</span>
                <span class="px-2.5 py-0.5 text-[9px] font-bold bg-zinc-900 text-cyan-400 rounded-full border border-zinc-800 tracking-wider uppercase">Vibe Engine</span>
            </div>
            <a href="https://github.com" target="_blank" class="text-sm font-semibold text-zinc-400 hover:text-zinc-100 transition-colors flex items-center">
                <span>View Source GitHub</span>
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://w3.org" style="width: 14px; height: 14px; min-width: 14px; max-width: 14px; margin-left: 6px; display: inline-block; vertical-align: middle; color: #52525b;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>
        </div>
    </header>

    <!-- Main Component Tree Target Container -->
    <main class="max-w-5xl mx-auto px-6 py-12 w-full flex-grow relative z-10 animate-slide-up">
        <!-- {{VAIB_DYNAMIC_MARKDOWN_BODY}} -->
    </main>

    <!-- Footer Block -->
    <footer class="border-t border-zinc-900 py-10 bg-[#030303] relative z-10">
        <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-zinc-600 gap-4">
            <div>&copy; 2026 vaib Architecture framework. Open-source under MIT bounds.</div>
            <div class="tracking-widest uppercase font-semibold text-zinc-700 font-mono text-[9px]">Pre-Compiled Static Build</div>
        </div>
    </footer>

</body>
</html>
